<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Minigame</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="mg" class="hidden">
        <div class="panel">
            <div class="head">
                <div>
                    <div class="title" id="mg-title"></div>
                    <div class="hint" id="mg-hint"></div>
                </div>
                <div class="timer hidden" id="mg-timer"></div>
            </div>
            <div class="stage" id="mg-stage"></div>
            <div class="foot">
                <div class="mistakes" id="mg-mistakes"></div>
                <div class="keys" id="mg-keys"></div>
            </div>
        </div>
    </div>
    <script src="game.js"></script>
</body>
</html>
