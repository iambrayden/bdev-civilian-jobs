<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gigs</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="app">
        <header class="top">
            <div class="brand">Gigs</div>
            <div class="hello" id="hello">Find work around the city</div>
        </header>

        <main>
            <section class="view active" id="view-jobs">
                <div class="section-title">Hiring now</div>
                <div class="list" id="jobs-list"></div>
            </section>

            <section class="view" id="view-shift">
                <div id="shift-box"></div>
            </section>

            <section class="view" id="view-help">
                <div id="help-box"></div>
            </section>
        </main>

        <nav class="tabs">
            <button class="tab active" data-view="jobs">
                <svg viewBox="0 0 24 24"><rect x="3" y="7" width="18" height="13" rx="2"/><path d="M8 7V5a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>
                Jobs
            </button>
            <button class="tab" data-view="shift">
                <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>
                My shift
                <span class="badge-dot hidden" id="shift-dot"></span>
            </button>
            <button class="tab" data-view="help">
                <svg viewBox="0 0 24 24"><path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1.9.4 1.8.7 2.7a2 2 0 0 1-.5 2.1L8 9.8a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.4c.9.3 1.8.6 2.7.7a2 2 0 0 1 1.7 2z"/></svg>
                Get help
            </button>
        </nav>

        <div class="sheet-backdrop hidden" id="sheet-backdrop"></div>
        <div class="sheet hidden" id="sheet"></div>
        <div class="toast hidden" id="toast"></div>
    </div>
    <script src="app.js"></script>
</body>
</html>
